# 배포(prod) 환경 구성.
#
# 실제 배포는 앱 서버 파이 한 대에 백엔드·프론트엔드만 올리고, DB 는 DB 서버 파이에서 이미 도는
# Beetle 의 MySQL 안에 `jipsa` 데이터베이스를 하나 더 만들어 쓴다 (SETUP.md).
#
#   앱 서버: docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                           -f docker-compose.app.yml up -d --build
#
# 이 파일만으로 한 호스트에 전부 올릴 수도 있다(그때는 .env 에 MYSQL_ROOT_PASSWORD 를 직접 채운다).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 로컬 파일(docker-compose.override.yml)은 `-f` 를 명시하면 적용되지 않는다.
# 접속 정보에는 기본값을 두지 않는다. 값이 없으면 기동에 실패하며, 이 편이 안전하다.
services:
  # MySQL 의 루트 비밀번호는 여기서 요구하지 않는다. 여기서 요구하면 DB 를 띄우지 않는
  # 앱 서버에도 루트 비밀번호를 두게 된다. 앱 서버에 루트 비밀번호가 있으면 앱 서버가
  # 뚫렸을 때 Beetle 의 데이터까지 내주게 된다.
  mysql:
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME 을 설정해야 합니다}
      MYSQL_USER: ${DB_USER:?DB_USER 를 설정해야 합니다}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 설정해야 합니다}
    # DB 포트를 호스트에 노출하지 않는다. 백엔드는 compose 네트워크로 접속한다.
    restart: unless-stopped

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_NAME: ${DB_NAME:?DB_NAME 을 설정해야 합니다}
      DB_USER: ${DB_USER:?DB_USER 를 설정해야 합니다}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 설정해야 합니다}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
    # 백엔드 포트도 노출하지 않는다. 브라우저가 보는 오리진은 프론트엔드 하나이며
    # nginx 가 /api 를 백엔드로 프록시한다. API 문서도 prod 프로필에서 꺼져 있다.
    restart: unless-stopped

  frontend:
    build:
      args:
        BUILD_MODE: production
    # 외부에 노출하는 것은 이 하나뿐이다. 같은 파이의 80 은 Beetle 이 쓰므로 8082 를 쓴다.
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    restart: unless-stopped
