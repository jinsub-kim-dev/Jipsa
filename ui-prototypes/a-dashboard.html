<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>후보 A · 대시보드형</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="data.js"></script>
<style>
  :root {
    --bg: #F4F6FA; --panel: #FFFFFF; --ink: #111827; --sub: #6B7280; --line: #E5E7EB;
    --accent: #2563EB; --up: #DC2626; --down: #059669;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Pretendard, -apple-system, sans-serif; background: var(--bg); color: var(--ink); display: flex; min-height: 100vh; }
  a { color: inherit; }
  .sidebar { width: 220px; background: #0F172A; color: #CBD5E1; padding: 24px 16px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; }
  .logo { color: #fff; font-weight: 800; font-size: 20px; margin: 0 8px 28px; }
  .logo span { color: #60A5FA; }
  .nav a { display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; text-decoration: none; font-size: 14px; margin-bottom: 2px; }
  .nav a.active { background: #1E293B; color: #fff; font-weight: 600; }
  .nav a:not(.active):hover { background: #1E293B80; }
  .back { position: absolute; bottom: 24px; left: 24px; font-size: 12px; color: #64748B; }
  main { flex: 1; padding: 28px 32px 60px; min-width: 0; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav h1 { font-size: 22px; margin: 0; min-width: 150px; text-align: center; }
  .month-nav small { color: var(--sub); font-size: 12px; }
  .icon-btn { border: 1px solid var(--line); background: #fff; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .card { background: var(--panel); border-radius: 14px; padding: 20px; border: 1px solid var(--line); min-width: 0; }
  .kpi .label { font-size: 13px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .kpi .value { font-size: 26px; font-weight: 800; margin: 8px 0 6px; letter-spacing: -0.5px; }
  .kpi .delta { font-size: 12px; color: var(--sub); }
  .delta .up { color: var(--up); font-weight: 600; } .delta .down { color: var(--down); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .kpi .bar { height: 4px; background: #F1F5F9; border-radius: 4px; margin-top: 12px; overflow: hidden; }
  .kpi .bar i { display: block; height: 100%; }
  .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 16px; display: flex; justify-content: space-between; align-items: center; }
  .card h2 small { font-weight: 400; color: var(--sub); font-size: 12px; }
  .chart-box { position: relative; height: 260px; }
  .tag-row { display: grid; grid-template-columns: 90px 1fr 80px; gap: 10px; align-items: center; font-size: 13px; padding: 5px 0; cursor: pointer; border-radius: 6px; }
  .tag-row:hover .tname { color: var(--accent); }
  .tag-row.sel .tname { color: var(--accent); font-weight: 700; }
  .tag-row .track { height: 8px; background: #EEF2FF; border-radius: 4px; overflow: hidden; }
  .tag-row .track i { display: block; height: 100%; background: #6366F1; border-radius: 4px; }
  .tag-row .amt { text-align: right; color: var(--sub); font-variant-numeric: tabular-nums; }
  .ins { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ins:last-child { border-bottom: 0; }
  .ins .top { display: flex; justify-content: space-between; font-size: 14px; }
  .ins .top b { font-weight: 600; }
  .ins .meta { font-size: 12px; color: var(--sub); margin: 4px 0 8px; display: flex; justify-content: space-between; }
  .progress { height: 6px; background: #F3E8FF; border-radius: 4px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: #8B5CF6; }
  .table-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip.tag-on { background: #EEF2FF; color: #4338CA; border-color: #C7D2FE; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--sub); font-size: 12px; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 11px 8px; border-bottom: 1px solid #F3F4F6; vertical-align: middle; }
  td.amt, th.amt { text-align: right; font-variant-numeric: tabular-nums; }
  td.amt { font-weight: 600; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600; white-space: nowrap; }
  .tag { font-size: 12px; color: #4338CA; background: #EEF2FF; padding: 2px 7px; border-radius: 5px; margin-right: 4px; white-space: nowrap; }
  .muted { color: var(--sub); font-size: 13px; }
  .more { text-align: center; padding-top: 12px; }
  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: min(460px, 92vw); padding: 24px; max-height: 90vh; overflow: auto; }
  .modal h3 { margin: 0 0 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
  .amount-input { font-size: 22px !important; font-weight: 700; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 10px; font-family: inherit; font-size: 14px; cursor: pointer; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { color: #fff; font-weight: 600; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tag-input { border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag-input input { border: 0 !important; flex: 1; min-width: 100px; padding: 4px !important; outline: none; }
  .tag-input .tag { cursor: pointer; }
  .suggest { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .suggest span { font-size: 12px; color: var(--sub); border: 1px dashed var(--line); padding: 2px 7px; border-radius: 5px; cursor: pointer; }
  .hint { font-size: 12px; color: #7C3AED; margin-top: 6px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } .grid { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { .sidebar { display: none; } main { padding: 16px; } .hide-sm { display: none; } }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">Jipsa<span>.</span></div>
  <nav class="nav">
    <a class="active" href="#">📊 대시보드</a>
    <a href="#">🧾 거래 내역</a>
    <a href="#">📈 패턴 분석</a>
    <a href="#">🏷️ 태그 관리</a>
    <a href="#">🔁 고정비·할부</a>
    <a href="#">⚙️ 설정</a>
  </nav>
  <a class="back" href="index.html">← 후보 목록</a>
</aside>

<main>
  <header>
    <div class="month-nav">
      <button class="icon-btn" id="prev">◀</button>
      <div style="text-align:center"><h1 id="month"></h1><small id="asof"></small></div>
      <button class="icon-btn" id="next">▶</button>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost">CSV 가져오기</button>
      <button class="btn" id="open-add">+ 지출 추가</button>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="card">
      <h2>월별 지출 추이 <small>종류별 누적 · 최근 6개월</small></h2>
      <div class="chart-box"><canvas id="trend"></canvas></div>
    </div>
    <div class="card">
      <h2>카테고리 비중 <small id="cat-total"></small></h2>
      <div class="chart-box"><canvas id="donut"></canvas></div>
    </div>
  </section>

  <section class="grid">
    <div class="card">
      <h2>태그 TOP 10 <small>클릭하면 아래 내역이 필터돼요 · 태그는 중복 집계</small></h2>
      <div id="tags"></div>
    </div>
    <div class="card">
      <h2>진행 중인 할부 <small id="ins-sum"></small></h2>
      <div id="ins"></div>
    </div>
  </section>

  <section class="card">
    <div class="table-head">
      <h2 style="margin:0">거래 내역 <small id="tx-count" style="margin-left:6px"></small></h2>
      <div class="chips" id="kind-chips"></div>
    </div>
    <table>
      <thead><tr><th>날짜</th><th>사용처</th><th class="hide-sm">카테고리</th><th>종류</th><th class="hide-sm">태그</th><th class="hide-sm">결제수단</th><th class="amt">금액</th></tr></thead>
      <tbody id="tx"></tbody>
    </table>
    <div class="more" id="more"></div>
  </section>
</main>

<div class="modal-bg" id="modal">
  <form class="modal" id="add-form">
    <h3>지출 추가</h3>
    <div class="field"><label>금액</label><input class="amount-input" id="f-amount" inputmode="numeric" placeholder="0원" required></div>
    <div class="field"><label>종류</label><div class="seg" id="f-kind"></div>
      <div id="ins-fields" style="display:none;margin-top:10px" class="row2">
        <select id="f-months"><option value="2">2개월</option><option value="3" selected>3개월</option><option value="6">6개월</option><option value="10">10개월</option><option value="12">12개월</option><option value="24">24개월</option></select>
        <input id="f-monthly" disabled>
      </div>
      <div class="hint" id="kind-hint"></div>
    </div>
    <div class="row2">
      <div class="field"><label>날짜</label><input type="date" id="f-date" value="2026-11-26"></div>
      <div class="field"><label>카테고리</label><select id="f-cat"></select></div>
    </div>
    <div class="field"><label>사용처</label><input id="f-merchant" placeholder="예: 스타벅스" required></div>
    <div class="field"><label>태그 (Enter로 추가)</label>
      <div class="tag-input" id="tag-box"><input id="f-tag" placeholder="#태그"></div>
      <div class="suggest" id="tag-suggest"></div>
    </div>
    <div class="actions"><button type="button" class="btn ghost" id="cancel">취소</button><button class="btn">저장</button></div>
  </form>
</div>

<script>
const L = LEDGER;
let mi = L.MONTHS.length - 1, kindFilter = 'all', tagFilter = null, showAll = false;
let trendChart, donutChart;
const $ = (id) => document.getElementById(id);

function deltaHtml(cur, prev) {
  const p = L.pct(cur, prev);
  if (p === null) return '<span>지난달 데이터 없음</span>';
  const cls = p > 0 ? 'up' : 'down';
  return `지난달 대비 <span class="${cls}">${p > 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(1)}%</span>`;
}

function render() {
  const m = L.MONTHS[mi];
  const list = L.inMonth(m);
  const prev = mi > 0 ? L.inMonth(L.MONTHS[mi - 1]) : null;
  const k = L.byKind(list), pk = prev ? L.byKind(prev) : {};
  const total = L.sum(list), ptotal = prev ? L.sum(prev) : 0;

  $('month').textContent = L.monthLabel(m);
  $('asof').textContent = m === L.TODAY.slice(0, 7) ? `${Number(L.TODAY.slice(8))}일까지 집계` : '월 마감';
  $('prev').disabled = mi === 0; $('next').disabled = mi === L.MONTHS.length - 1;

  // KPI
  const kpi = (label, val, prevVal, color, ratio) => `
    <div class="card kpi">
      <div class="label">${color ? `<span class="dot" style="background:${color}"></span>` : ''}${label}</div>
      <div class="value">${L.won(val)}</div>
      <div class="delta">${deltaHtml(val, prevVal)}</div>
      ${ratio !== undefined ? `<div class="bar"><i style="width:${ratio}%;background:${color}"></i></div>` : ''}
    </div>`;
  $('kpis').innerHTML = kpi('이번 달 총 지출', total, prev && ptotal) +
    Object.entries(L.KINDS).map(([key, v]) => kpi(`${v.label} · ${(k[key] / total * 100).toFixed(0)}%`, k[key], prev && pk[key], v.color, k[key] / total * 100)).join('');

  // trend
  trendChart && trendChart.destroy();
  trendChart = new Chart($('trend'), {
    type: 'bar',
    data: {
      labels: L.MONTHS.map(L.shortMonth),
      datasets: Object.entries(L.KINDS).map(([key, v]) => ({
        label: v.label, data: L.MONTHS.map((mm) => L.byKind(L.inMonth(mm))[key]),
        backgroundColor: L.MONTHS.map((_, i) => i === mi ? v.color : v.color + '55'), borderRadius: 4, maxBarThickness: 46,
      })),
    },
    options: {
      maintainAspectRatio: false,
      onClick: (_, els) => { if (els.length) { mi = els[0].index; render(); } },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${L.won(c.raw)}` } } },
      scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { callback: (v) => L.man(v) }, grid: { color: '#F1F5F9' } } },
    },
  });

  // donut
  const cats = L.groupSum(list, (t) => t.category);
  $('cat-total').textContent = `${cats.length}개 카테고리`;
  donutChart && donutChart.destroy();
  donutChart = new Chart($('donut'), {
    type: 'doughnut',
    data: { labels: cats.map(([c]) => `${L.CATEGORIES[c].icon} ${c}`), datasets: [{ data: cats.map(([, v]) => v), backgroundColor: cats.map(([c]) => L.CATEGORIES[c].color), borderWidth: 2 }] },
    options: { maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 12 } } }, tooltip: { callbacks: { label: (c) => ` ${L.won(c.raw)} (${(c.raw / total * 100).toFixed(1)}%)` } } } },
  });

  // tags
  const tags = L.groupSum(list, (t) => t.tags).slice(0, 10);
  const maxT = tags[0] ? tags[0][1] : 1;
  $('tags').innerHTML = tags.map(([t, v]) => `
    <div class="tag-row ${tagFilter === t ? 'sel' : ''}" data-tag="${t}">
      <span class="tname">#${t}</span><div class="track"><i style="width:${v / maxT * 100}%"></i></div><span class="amt">${L.won(v)}</span>
    </div>`).join('');
  document.querySelectorAll('.tag-row').forEach((el) => el.onclick = () => { tagFilter = tagFilter === el.dataset.tag ? null : el.dataset.tag; render(); });

  // installments
  const ins = L.installmentStatus(m);
  $('ins-sum').textContent = `월 ${L.won(ins.reduce((s, i) => s + i.monthly, 0))}`;
  $('ins').innerHTML = ins.map((i) => `
    <div class="ins">
      <div class="top"><b>${L.CATEGORIES[i.category].icon} ${i.merchant}</b><span>${L.won(i.monthly)}/월</span></div>
      <div class="meta"><span>${i.current}/${i.months}회차 · ${i.card}</span><span>남은 금액 ${L.won(i.remainingAmount)} · ${L.shortMonth(i.endMonth)} 종료</span></div>
      <div class="progress"><i style="width:${i.current / i.months * 100}%"></i></div>
    </div>`).join('') || '<p class="muted">진행 중인 할부가 없어요</p>';

  // table
  $('kind-chips').innerHTML = [['all', '전체'], ...Object.entries(L.KINDS).map(([kk, v]) => [kk, v.label])]
    .map(([kk, lab]) => `<button class="chip ${kindFilter === kk ? 'on' : ''}" data-kind="${kk}">${lab}</button>`).join('') +
    (tagFilter ? `<button class="chip tag-on" data-cleartag>#${tagFilter} ✕</button>` : '');
  document.querySelectorAll('[data-kind]').forEach((b) => b.onclick = () => { kindFilter = b.dataset.kind; render(); });
  const clr = document.querySelector('[data-cleartag]'); if (clr) clr.onclick = () => { tagFilter = null; render(); };

  const rows = list.filter((t) => (kindFilter === 'all' || t.kind === kindFilter) && (!tagFilter || t.tags.includes(tagFilter)));
  $('tx-count').textContent = `${rows.length}건 · ${L.won(L.sum(rows))}`;
  const shown = showAll ? rows : rows.slice(0, 15);
  $('tx').innerHTML = shown.map((t) => {
    const kv = L.KINDS[t.kind];
    return `<tr>
      <td class="muted">${t.date.slice(5).replace('-', '.')}</td>
      <td><b style="font-weight:600">${t.merchant}</b>${t.installment ? ` <span class="muted">(${t.installment.current}/${t.installment.total})</span>` : ''}</td>
      <td class="hide-sm">${L.CATEGORIES[t.category].icon} ${t.category}</td>
      <td><span class="badge" style="background:${kv.color}1f;color:${kv.color}">${kv.short}</span></td>
      <td class="hide-sm">${t.tags.map((g) => `<span class="tag">#${g}</span>`).join('')}</td>
      <td class="hide-sm muted">${t.card}</td>
      <td class="amt">-${L.fmt(t.amount)}</td></tr>`;
  }).join('');
  $('more').innerHTML = rows.length > 15 ? `<button class="chip" id="toggle-more">${showAll ? '접기' : `${rows.length - 15}건 더 보기`}</button>` : '';
  const tm = $('toggle-more'); if (tm) tm.onclick = () => { showAll = !showAll; render(); };
}

$('prev').onclick = () => { if (mi > 0) { mi--; render(); } };
$('next').onclick = () => { if (mi < L.MONTHS.length - 1) { mi++; render(); } };

// ---------- 추가 모달 ----------
let fKind = 'general', fTags = [];
$('f-cat').innerHTML = Object.entries(L.CATEGORIES).map(([c, v]) => `<option>${c}</option>`).join('');
function renderForm() {
  $('f-kind').innerHTML = Object.entries(L.KINDS).map(([k, v]) => `<button type="button" data-k="${k}" class="${fKind === k ? 'on' : ''}" style="${fKind === k ? `background:${v.color}` : ''}">${v.label}</button>`).join('');
  $('f-kind').querySelectorAll('button').forEach((b) => b.onclick = () => { fKind = b.dataset.k; renderForm(); });
  $('ins-fields').style.display = fKind === 'installment' ? 'grid' : 'none';
  const amt = Number($('f-amount').value.replace(/\D/g, '')) || 0;
  $('f-monthly').value = `월 ${L.won(Math.round(amt / Number($('f-months').value) / 10) * 10)}`;
  $('kind-hint').textContent = fKind === 'fixed' ? '매월 같은 날짜에 자동으로 반복 등록돼요' : fKind === 'installment' ? '총 결제금액을 입력하면 회차별로 나눠 매월 기록돼요' : '';
  const box = $('tag-box');
  box.querySelectorAll('.tag').forEach((e) => e.remove());
  fTags.forEach((t) => { const s = document.createElement('span'); s.className = 'tag'; s.textContent = `#${t} ✕`; s.onclick = () => { fTags = fTags.filter((x) => x !== t); renderForm(); }; box.insertBefore(s, $('f-tag')); });
  $('tag-suggest').innerHTML = L.allTags().filter((t) => !fTags.includes(t)).slice(0, 12).map((t) => `<span data-t="${t}">#${t}</span>`).join('');
  $('tag-suggest').querySelectorAll('span').forEach((s) => s.onclick = () => { fTags.push(s.dataset.t); renderForm(); });
}
$('f-amount').oninput = (e) => { const n = e.target.value.replace(/\D/g, ''); e.target.value = n ? Number(n).toLocaleString('ko-KR') : ''; renderForm(); };
$('f-months').onchange = renderForm;
$('f-tag').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); const v = e.target.value.replace(/^#/, '').trim(); if (v && !fTags.includes(v)) fTags.push(v); e.target.value = ''; renderForm(); } };
$('open-add').onclick = () => { $('modal').classList.add('open'); renderForm(); $('f-amount').focus(); };
$('cancel').onclick = () => $('modal').classList.remove('open');
$('modal').onclick = (e) => { if (e.target.id === 'modal') $('modal').classList.remove('open'); };
$('add-form').onsubmit = (e) => {
  e.preventDefault();
  const amount = Number($('f-amount').value.replace(/\D/g, ''));
  const months = Number($('f-months').value);
  L.TX.unshift({
    id: 'new' + Date.now(), date: $('f-date').value, merchant: $('f-merchant').value, kind: fKind, category: $('f-cat').value, tags: [...fTags], card: '신한카드',
    amount: fKind === 'installment' ? Math.round(amount / months / 10) * 10 : amount,
    installment: fKind === 'installment' ? { current: 1, total: months, principal: amount } : undefined,
  });
  L.TX.sort((a, b) => (a.date < b.date ? 1 : -1));
  const idx = L.MONTHS.indexOf($('f-date').value.slice(0, 7));
  $('modal').classList.remove('open'); $('add-form').reset(); fTags = []; fKind = 'general';
  if (idx >= 0) mi = idx; render();
};

render();
</script>
</body>
</html>
