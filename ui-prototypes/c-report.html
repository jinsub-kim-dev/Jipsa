<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>후보 C · 패턴 리포트형</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="data.js"></script>
<style>
  :root { --bg: #0B1020; --panel: #121A2E; --panel2: #18223A; --ink: #E5E9F2; --sub: #8A94AD; --line: #24304B; --accent: #7DD3FC; --up: #F87171; --down: #34D399; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Pretendard, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 28px 80px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
  .top .brand { font-weight: 800; font-size: 18px; }
  .top .brand a { font-weight: 400; font-size: 12px; color: var(--sub); margin-left: 10px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { background: transparent; border: 1px solid var(--line); color: var(--sub); border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .pill.on { background: var(--accent); color: #0B1020; border-color: var(--accent); font-weight: 700; }
  .hero { margin: 8px 0 26px; }
  .hero .eyebrow { color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .5px; }
  .hero h1 { font-size: 30px; line-height: 1.4; margin: 8px 0 0; font-weight: 700; letter-spacing: -0.5px; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .insights { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .ins { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .ins .k { font-size: 12px; color: var(--sub); }
  .ins .v { font-size: 22px; font-weight: 800; margin: 6px 0 4px; }
  .ins .d { font-size: 12px; color: var(--sub); line-height: 1.5; }
  .up { color: var(--up); } .down { color: var(--down); }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card .sub { font-size: 12px; color: var(--sub); margin-bottom: 14px; }
  .chart-box { position: relative; height: 250px; }
  .heat { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 12px; }
  .heat th { color: var(--sub); font-weight: 500; padding: 4px; text-align: center; }
  .heat th.row { text-align: left; white-space: nowrap; color: var(--ink); font-weight: 500; }
  .heat td { text-align: center; padding: 8px 4px; border-radius: 6px; font-variant-numeric: tabular-nums; cursor: default; }
  .heat td.sel { outline: 1.5px solid var(--accent); }
  .heat td.trend { background: transparent !important; text-align: left; padding-left: 8px; white-space: nowrap; }
  .tagtable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tagtable th { color: var(--sub); font-weight: 500; text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .tagtable th:first-child, .tagtable td:first-child { text-align: left; }
  .tagtable td { padding: 9px 6px; border-bottom: 1px solid #1B2540; text-align: right; font-variant-numeric: tabular-nums; }
  .spark { display: inline-block; vertical-align: middle; }
  .t { color: var(--accent); }
  .forecast-note { font-size: 12px; color: var(--sub); margin-top: 10px; line-height: 1.6; }
  .forecast-note b { color: var(--ink); }
  @media (max-width: 1000px) { .insights { grid-template-columns: repeat(2, 1fr); } .grid { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { .wrap { padding: 16px; } .hero h1 { font-size: 22px; } .heat { font-size: 10px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Jipsa 월간 리포트 <a href="index.html">← 후보 목록</a></div>
    <div class="pills" id="pills"></div>
  </div>

  <section class="hero">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="headline"></h1>
  </section>

  <section class="insights" id="insights"></section>

  <section class="card" style="margin-bottom:14px">
    <h2>카테고리 × 월 히트맵</h2>
    <div class="sub">셀 색이 진할수록 해당 카테고리의 6개월 평균 대비 많이 쓴 달이에요 (행 기준 정규화)</div>
    <div style="overflow-x:auto"><table class="heat" id="heat"></table></div>
  </section>

  <section class="grid">
    <div class="card">
      <h2>지출 구조 변화</h2>
      <div class="sub">종류별 누적 금액 + 약정 지출(고정비+할부) 비율</div>
      <div class="chart-box"><canvas id="structure"></canvas></div>
    </div>
    <div class="card">
      <h2>요일별 일반 지출 패턴</h2>
      <div class="sub" id="dow-sub"></div>
      <div class="chart-box"><canvas id="dow"></canvas></div>
    </div>
  </section>

  <section class="grid">
    <div class="card">
      <h2>태그 변화량</h2>
      <div class="sub">지난달 대비 증감 큰 순 · 6개월 추이 스파크라인</div>
      <table class="tagtable" id="tagtable"></table>
    </div>
    <div class="card">
      <h2>앞으로 6개월 약정 지출 전망</h2>
      <div class="sub">이미 약속된 고정비 + 남은 할부 회차</div>
      <div class="chart-box" style="height:220px"><canvas id="forecast"></canvas></div>
      <div class="forecast-note" id="forecast-note"></div>
    </div>
  </section>
</div>

<script>
const L = LEDGER;
const $ = (id) => document.getElementById(id);
let mi = L.MONTHS.length - 1;
const charts = {};
Chart.defaults.color = '#8A94AD';
Chart.defaults.borderColor = '#24304B';
Chart.defaults.font.family = 'Pretendard';

function spark(values, w = 70, h = 20) {
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const pts = values.map((v, i) => `${(i / (values.length - 1)) * w},${h - ((v - min) / (max - min || 1)) * (h - 2) - 1}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="#7DD3FC" stroke-width="1.5"/></svg>`;
}
const signPct = (p) => p === null ? '–' : `<span class="${p > 0 ? 'up' : 'down'}">${p > 0 ? '+' : ''}${p.toFixed(0)}%</span>`;

function render() {
  const m = L.MONTHS[mi];
  const list = L.inMonth(m);
  const prevM = L.MONTHS[mi - 1];
  const prev = prevM ? L.inMonth(prevM) : [];
  const total = L.sum(list);
  const isCur = m === L.TODAY.slice(0, 7);

  $('pills').innerHTML = L.MONTHS.map((mm, i) => `<button class="pill ${i === mi ? 'on' : ''}" data-i="${i}">${L.shortMonth(mm)}</button>`).join('');
  document.querySelectorAll('.pill').forEach((b) => b.onclick = () => { mi = Number(b.dataset.i); render(); });

  // headline
  const past = L.MONTHS.slice(Math.max(0, mi - 3), mi);
  const avg3 = past.length ? past.reduce((s, mm) => s + L.sum(L.inMonth(mm)), 0) / past.length : null;
  const dAvg = avg3 ? L.pct(total, avg3) : null;
  const catNow = Object.fromEntries(L.groupSum(list, (t) => t.category));
  const catPrev = Object.fromEntries(L.groupSum(prev, (t) => t.category));
  const catDelta = Object.keys(catNow).map((c) => [c, catNow[c] - (catPrev[c] || 0)]).sort((a, b) => b[1] - a[1]);
  const [topC, topCd] = catDelta[0] || ['-', 0];
  $('eyebrow').textContent = `${L.monthLabel(m)} 리포트${isCur ? ` · ${Number(L.TODAY.slice(8))}일 기준` : ''}`;
  $('headline').innerHTML = dAvg === null
    ? `이번 달 <em>${L.won(total)}</em>을 썼어요.`
    : `이번 달은 최근 3개월 평균보다 <em>${Math.abs(dAvg).toFixed(0)}% ${dAvg > 0 ? '더' : '덜'}</em> 썼고,<br>가장 크게 늘어난 건 <em>${L.CATEGORIES[topC].icon} ${topC} (+${L.man(topCd)})</em>이에요.`;

  // insights
  const k = L.byKind(list);
  const committed = k.fixed + k.installment;
  const tagNow = Object.fromEntries(L.groupSum(list, (t) => t.tags));
  const tagPrev = Object.fromEntries(L.groupSum(prev, (t) => t.tags));
  const tagSpike = Object.keys(tagNow).filter((t) => tagNow[t] > 30000).map((t) => [t, L.pct(tagNow[t], tagPrev[t] || 0)]).filter(([, p]) => p !== null).sort((a, b) => b[1] - a[1])[0];
  const newTags = Object.keys(tagNow).filter((t) => !tagPrev[t]);
  const gen = list.filter((t) => t.kind === 'general');
  const days = isCur ? Number(L.TODAY.slice(8)) : L.daysIn(m);
  $('insights').innerHTML = [
    ['총 지출', L.won(total), prevM ? `지난달 대비 ${signPct(L.pct(total, L.sum(prev)))}` : ''],
    ['약정 지출 비중', `${(committed / total * 100).toFixed(0)}%`, `고정비 ${L.man(k.fixed)} + 할부 ${L.man(k.installment)}<br>줄이기 어려운 지출이에요`],
    ['하루 평균 일반 지출', L.won(L.sum(gen) / days), `${gen.length}건 · 건당 평균 ${L.won(L.sum(gen) / (gen.length || 1))}`],
    tagSpike ? ['급증한 태그', `#${tagSpike[0]}`, `지난달 대비 ${signPct(tagSpike[1])} · ${L.won(tagNow[tagSpike[0]])}${newTags.length ? `<br>새 태그: ${newTags.slice(0, 3).map((t) => '#' + t).join(' ')}` : ''}`] : ['급증한 태그', '-', ''],
  ].map(([kk, v, d]) => `<div class="ins"><div class="k">${kk}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join('');

  // heatmap
  const cats = Object.keys(L.CATEGORIES);
  const matrix = cats.map((c) => L.MONTHS.map((mm) => L.sum(L.inMonth(mm).filter((t) => t.category === c)))).map((row, i) => ({ c: cats[i], row }))
    .filter((r) => r.row.some((v) => v)).sort((a, b) => b.row[mi] - a.row[mi]);
  $('heat').innerHTML = `<tr><th></th>${L.MONTHS.map((mm, i) => `<th style="${i === mi ? 'color:#7DD3FC' : ''}">${L.shortMonth(mm)}</th>`).join('')}<th style="text-align:left;padding-left:8px">추이</th></tr>` +
    matrix.map(({ c, row }) => {
      const max = Math.max(...row);
      return `<tr><th class="row">${L.CATEGORIES[c].icon} ${c}</th>${row.map((v, i) => {
        const a = max ? v / max : 0;
        return `<td class="${i === mi ? 'sel' : ''}" title="${L.won(v)}" style="background:rgba(125,211,252,${0.05 + a * 0.6});color:${a > 0.6 ? '#0B1020' : '#E5E9F2'}">${v ? L.man(v) : '·'}</td>`;
      }).join('')}<td class="trend">${spark(row)}</td></tr>`;
    }).join('');

  // structure chart
  charts.s && charts.s.destroy();
  const kindSeries = L.MONTHS.map((mm) => L.byKind(L.inMonth(mm)));
  charts.s = new Chart($('structure'), {
    data: {
      labels: L.MONTHS.map(L.shortMonth),
      datasets: [
        ...Object.entries(L.KINDS).map(([kk, v]) => ({ type: 'bar', label: v.label, data: kindSeries.map((s) => s[kk]), backgroundColor: L.MONTHS.map((_, i) => i === mi ? v.color : v.color + '80'), stack: 's', yAxisID: 'y', borderRadius: 3, maxBarThickness: 40 })),
        { type: 'line', label: '약정 비율', data: kindSeries.map((s) => ((s.fixed + s.installment) / (s.general + s.fixed + s.installment)) * 100), borderColor: '#7DD3FC', backgroundColor: '#7DD3FC', yAxisID: 'y1', tension: .35, pointRadius: 3 },
      ],
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } }, tooltip: { callbacks: { label: (c) => c.dataset.yAxisID === 'y1' ? ` 약정 비율 ${c.raw.toFixed(1)}%` : ` ${c.dataset.label} ${L.won(c.raw)}` } } },
      scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { callback: (v) => L.man(v) } }, y1: { position: 'right', min: 0, max: 100, grid: { display: false }, ticks: { callback: (v) => v + '%' } } },
    },
  });

  // day-of-week
  const dowNames = ['일', '월', '화', '수', '목', '금', '토'];
  const dowSum = Array(7).fill(0), dowCnt = Array(7).fill(0);
  const [y, mo] = m.split('-').map(Number);
  for (let d = 1; d <= days; d++) dowCnt[new Date(y, mo - 1, d).getDay()]++;
  gen.forEach((t) => { dowSum[new Date(t.date).getDay()] += t.amount; });
  const dowAvg = dowSum.map((s, i) => (dowCnt[i] ? s / dowCnt[i] : 0));
  const peak = dowAvg.indexOf(Math.max(...dowAvg));
  $('dow-sub').textContent = `${dowNames[peak]}요일에 가장 많이 써요 · 하루 평균 ${L.won(dowAvg[peak])}`;
  charts.d && charts.d.destroy();
  charts.d = new Chart($('dow'), {
    type: 'bar',
    data: { labels: dowNames, datasets: [{ data: dowAvg, backgroundColor: dowAvg.map((_, i) => i === peak ? '#7DD3FC' : '#2B3A5C'), borderRadius: 6 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` 평균 ${L.won(c.raw)}` } } }, scales: { x: { grid: { display: false } }, y: { ticks: { callback: (v) => L.man(v) } } } },
  });

  // tag table
  const tagRows = Object.keys({ ...tagNow, ...tagPrev }).map((t) => ({ t, now: tagNow[t] || 0, prev: tagPrev[t] || 0, series: L.MONTHS.map((mm) => L.sum(L.inMonth(mm).filter((x) => x.tags.includes(t)))) }))
    .filter((r) => r.now + r.prev > 40000).sort((a, b) => Math.abs(b.now - b.prev) - Math.abs(a.now - a.prev)).slice(0, 9);
  $('tagtable').innerHTML = `<tr><th>태그</th><th>이번 달</th><th>지난달</th><th>증감</th><th>6개월</th></tr>` +
    tagRows.map((r) => `<tr><td class="t">#${r.t}</td><td>${L.man(r.now)}</td><td style="color:#8A94AD">${L.man(r.prev)}</td><td>${r.prev ? signPct(L.pct(r.now, r.prev)) : '<span class="up">NEW</span>'}</td><td>${spark(r.series)}</td></tr>`).join('');

  // forecast
  const fc = L.commitmentForecast(m, 6);
  charts.f && charts.f.destroy();
  charts.f = new Chart($('forecast'), {
    type: 'bar',
    data: { labels: fc.map((f) => L.shortMonth(f.month)), datasets: [
      { label: '고정비', data: fc.map((f) => f.fixed), backgroundColor: L.KINDS.fixed.color, borderRadius: 3, maxBarThickness: 34 },
      { label: '할부', data: fc.map((f) => f.installment), backgroundColor: L.KINDS.installment.color, borderRadius: 3, maxBarThickness: 34 },
    ] },
    options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } }, tooltip: { callbacks: { afterBody: (items) => '할부: ' + (fc[items[0].dataIndex].plans.join(', ') || '없음') } } }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { callback: (v) => L.man(v) } } } },
  });
  const ending = L.installmentStatus(m).filter((i) => i.remaining <= 3).map((i) => i.remaining === 0 ? `<b>${i.merchant}</b> 이번 달 마지막 회차 (다음 달부터 -${L.man(i.monthly)})` : `<b>${i.merchant}</b> ${i.remaining}회 남음 → ${L.shortMonth(i.endMonth)} 종료`);
  $('forecast-note').innerHTML = ending.length ? '곧 끝나는 할부<br>' + ending.join('<br>') : '';
}
render();
</script>
</body>
</html>
